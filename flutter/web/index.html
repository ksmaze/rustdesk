<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Remote Desktop.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RustDesk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <title>RustDesk</title>
  <link rel="manifest" href="manifest.json">

  <!-- Runtime config injection (generated by entrypoint from env vars) -->
  <script src="config.js"></script>

  <!-- RustDesk JS bridge dependencies -->
  <script src="ogvjs-1.8.6/ogv.js"></script>
  <script type="module" crossorigin src="js/dist/index.js"></script>
  <link rel="modulepreload" href="js/dist/vendor.js">
  <script src="yuv-canvas-1.2.6.js"></script>

  <style>
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .loader {
      border-radius: 50%;
      border: 16px solid;
      border-color: #024eff white #024eff white;
      width: 120px;
      height: 120px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

</head>

<body>
  <div class="loading">
    <div class="loader"></div>
  </div>

  <!-- Flutter 3.24.5 bootstrap - uses custom flutter_bootstrap.js from web/ -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
